<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Vendi-Go — the machine, by the serving</title>
  <desc id="desc">Animated hero: a realistic Vendi-Go kiosk with a lit glass shelf of supplement cans, a touchscreen, a card reader and a cup filling under the dispenser.</desc>
  <defs>
