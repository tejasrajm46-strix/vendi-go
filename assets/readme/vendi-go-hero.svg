<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vendi-Go — your supplements, by the serving</title>
  <desc id="desc">Animated hero: the Vendi-Go wordmark beside a kiosk that dispenses a measured serving of pre-workout into a cup.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2C3480" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2C3480" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3480"/>
      <stop offset="1" stop-color="#1B2054"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
    <clipPath id="cupClip"><path d="M0 0h72l-7 62H7Z"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#000000"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="986" cy="118" r="300" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="0" width="1200" height="3" fill="#2C3480"/>
    <rect x="0" y="0" width="220" height="3" fill="#FFFFFF" fill-opacity="0.85">
      <animate attributeName="x" values="-220;1200" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <text x="64" y="98" fill="#FFFFFF" fill-opacity="0.55" font-size="13" font-weight="700" letter-spacing="3.6">SMART SUPPLEMENT KIOSK</text>
      <rect x="64" y="112" width="46" height="3" fill="#2C3480"/>

      <text x="64" y="198" fill="#FFFFFF" font-size="86" font-weight="800" letter-spacing="-3">VENDI</text>
      <rect x="334" y="130" width="124" height="78" rx="12" fill="url(#cobalt)">
        <animate attributeName="y" values="137;130;137" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="354" y="198" fill="#FFFFFF" font-size="86" font-weight="800" letter-spacing="-3">GO</text>

      <text x="64" y="248" fill="#FFFFFF" fill-opacity="0.82" font-size="25" font-weight="500">Your supplements. By the serving.</text>

      <g font-size="11" font-weight="700" letter-spacing="1.8">
        <rect x="64" y="274" width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="84" y="294" fill="#FFFFFF" fill-opacity="0.8">PRE-WORKOUT</text>
        <rect x="208" y="274" width="104" height="30" rx="15" fill="#2C3480"/>
        <text x="228" y="294" fill="#FFFFFF" fill-opacity="0.95">PROTEIN</text>
        <rect x="324" y="274" width="112" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="344" y="294" fill="#FFFFFF" fill-opacity="0.8">CREATINE</text>
      </g>

      <text x="64" y="352" fill="#FFFFFF" fill-opacity="0.42" font-size="12" font-weight="600" letter-spacing="2.6">PICK · MEASURE · POUR · COLLECT</text>
      <rect x="64" y="372" width="300" height="2" fill="#2C3480" fill-opacity="0.9"/>
    </g>

    <g transform="translate(768 46)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <rect width="368" height="328" rx="22" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <rect x="20" y="18" width="328" height="292" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <text x="26" y="42" fill="#FFFFFF" fill-opacity="0.55" font-size="11" font-weight="700" letter-spacing="2.4">SERVING 01 · 12 g</text>
      <circle cx="332" cy="38" r="4.5" fill="#FFFFFF" fill-opacity="0.2">
        <animate attributeName="fill-opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <g>
        <g transform="translate(26 66)">
          <rect width="96" height="136" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
          <rect x="34" y="20" width="28" height="52" rx="7" fill="#FFFFFF" fill-opacity="0.92"/>
          <rect x="34" y="80" width="28" height="7" rx="3.5" fill="#2C3480"/>
          <rect x="22" y="102" width="52" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.26"/>
          <rect x="22" y="114" width="32" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.16"/>
        </g>
        <g transform="translate(136 66)">
          <rect width="96" height="136" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
          <rect x="34" y="20" width="28" height="52" rx="7" fill="#2C3480"/>
          <rect x="34" y="80" width="28" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
          <rect x="22" y="102" width="52" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.26"/>
          <rect x="22" y="114" width="40" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.16"/>
        </g>
        <g transform="translate(246 66)">
          <rect width="96" height="136" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
          <rect x="34" y="20" width="28" height="52" rx="7" fill="#FFFFFF" fill-opacity="0.92"/>
          <rect x="34" y="80" width="28" height="7" rx="3.5" fill="#2C3480"/>
          <rect x="22" y="102" width="52" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.26"/>
          <rect x="22" y="114" width="26" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.16"/>
        </g>
      </g>

      <g fill="#FFFFFF" fill-opacity="0.7">
        <rect x="72" y="206" width="2" height="0">
          <animate attributeName="height" values="0;46;0" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.75;0" dur="3.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="186" y="206" width="2" height="0">
          <animate attributeName="height" values="0;46;0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.75;0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="298" y="206" width="2" height="0">
          <animate attributeName="height" values="0;46;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.75;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g fill="#FFFFFF" fill-opacity="0.6">
        <circle cx="73" cy="214" r="1.6">
          <animate attributeName="cy" values="208;250" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.7;0" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="187" cy="214" r="1.6">
          <animate attributeName="cy" values="208;250" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.7;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="299" cy="214" r="1.6">
          <animate attributeName="cy" values="208;250" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0;0.7;0" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(150 258)">
        <path d="M0 0h72l-7 62H7Z" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.4"/>
        <g clip-path="url(#cupClip)">
          <rect x="0" y="62" width="72" height="0" fill="#2C3480">
            <animate attributeName="y" values="62;18;18;62" dur="7.2s" repeatCount="indefinite"/>
            <animate attributeName="height" values="0;44;44;0" dur="7.2s" repeatCount="indefinite"/>
          </rect>
        </g>
        <rect x="4" y="-7" width="64" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.32"/>
      </g>

      <rect x="26" y="300" width="316" height="2" rx="1" fill="#2C3480" fill-opacity="0.9"/>
      <rect x="26" y="300" width="316" height="2" rx="1" fill="url(#fade)" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
